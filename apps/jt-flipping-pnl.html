/* ---------- tetapan lalai untuk ciri baru ---------- */
function normSettings(st){
  if(!st) return st;
  if(!Array.isArray(st.expenseCats)||!st.expenseCats.length) st.expenseCats=DEF_CATS.slice();
  if(!st.expenseCats.includes(STOK)) st.expenseCats.unshift(STOK);
  if(!Array.isArray(st.stock)){
    st.stock=st.products.map(p=>({name:p.name,opening:0,openingDate:st.year+"-01-01",min:50}))
      .concat([{name:"HALIA PATCH",opening:0,openingDate:st.year+"-01-01",min:50},{name:"KAYU",opening:0,openingDate:st.year+"-01-01",min:10}]);
  }
  return st;
}

/* ---------- kira jualan (sama seperti Excel) ---------- */
function rateFor(prod,chan,date){
  let best=null;
  for(const r of (S.settings?.rates||[])){ if(r.prod===prod&&r.chan===chan&&r.from<=date&&(!best||r.from>best.from)) best=r; }
  return best;
}
function prodOf(name){return (S.settings?.products||[]).find(p=>p.name===name)}
function calc(row){
  const r=rateFor(row.prod,row.chan,row.date), p=prodOf(row.prod);
  const ot=(row.ot||[0,0,0]).map(n), cod=(row.cod||[0,0,0]).map(n);
  const purchase=ot.concat(cod).reduce((a,b)=>a+b,0);
  if(!r||!p) return {err:true,purchase,qty:0,sales:0,ads:n(row.ads),net:0,clicks:n(row.clicks),freePatch:0,freeKayu:0};
  const S3=(a,b)=>a.reduce((s,v,i)=>s+v*n(b[i]),0);
  const u=p.units, ads=n(row.ads);
  const qty=S3(ot,u)+S3(cod,u);
  const freePatch=S3(ot,r.patchOT)+S3(cod,r.patchCOD);
  const freeKayu=S3(ot,r.kayuOT)+S3(cod,r.kayuCOD);
  const patchSales=n(row.patch)*n(r.patchPrice);
  const sales=S3(ot,r.ot)+S3(cod,r.cod)+patchSales-n(row.freePost);
  const taxAds=ads*n(S.settings.taxAd);
  const shipOT=S3(ot,r.posOT), shipCOD=S3(cod,r.posCOD);
  const taxShipOT=shipOT*n(S.settings.taxShip), taxShipCOD=shipCOD*n(S.settings.taxShip);
  const cost=qty*n(r.cost), gift=freePatch*n(p.patchCost)+freeKayu*n(p.kayuCost);
  const other=n(row.special)+n(row.openai)+n(row.sabah);
  const net=sales-ads-taxAds-shipOT-shipCOD-taxShipOT-taxShipCOD-cost-gift-other;
  return {err:false,rate:r,purchase,qty,freePatch,freeKayu,patchSales,sales,ads,taxAds,shipOT,shipCOD,taxShipOT,taxShipCOD,cost,gift,other,
    special:n(row.special),openai:n(row.openai),sabah:n(row.sabah),freePost:n(row.freePost),net,clicks:n(row.clicks),
    roas:ads?sales/ads:0,roasTax:ads?sales/(ads+taxAds):0,cpp:ads&&purchase?ads/purchase:0,conv:n(row.clicks)?purchase/n(row.clicks):0};
}
function retValue(rt){const p=prodOf(rt.prod);return n(rt.count)*n(p?.ret?.[rt.pk]??0)+n(rt.special)}
function collect(field,map){
  const out=[];
  for(const m of Object.values(S.months)) for(const [k,r] of Object.entries(m[field]||{})) if(r&&r.date) out.push(map(k,r));
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
const allRows=()=>collect("rows",(k,r)=>({key:k,...r,c:calc(r)}));
const allReturns=()=>collect("returns",(k,r)=>({id:k,...r,v:retValue(r)}));
const allExp=()=>collect("expenses",(k,r)=>({id:k,...r}));
const allAdj=()=>collect("stockAdj",(k,r)=>({id:k,...r}));
function agg(rows){
  const a={sales:0,ads:0,taxAds:0,net:0,purchase:0,qty:0,clicks:0,pc:0,ship:0,cost:0,other:0,n:0};
  for(const r of rows){const c=r.c;a.sales+=c.sales;a.ads+=c.ads;a.taxAds+=c.taxAds||0;a.net+=c.net;a.purchase+=c.purchase;a.qty+=c.qty;a.clicks+=c.clicks;if(c.clicks)a.pc+=c.purchase;
    a.ship+=(c.shipOT||0)+(c.shipCOD||0)+(c.taxShipOT||0)+(c.taxShipCOD||0);a.cost+=(c.cost||0)+(c.gift||0);a.other+=c.other||0;a.n++}
  return a;
}
function expAgg(list){let op=0,stock=0;for(const e of list){if(e.cat===STOK)stock+=n(e.amount);else op+=n(e.amount)}return {op,stock}}

/* ---------- stok ---------- */
function usageOf(row,c,item){
  if(item===row.prod) return c.qty||0;
  if(item==="HALIA PATCH") return (c.freePatch||0)+(c.err?0:n(row.patch));
  if(item==="KAYU") return c.freeKayu||0;
  return 0;
}
function stockStat(item,rows,exps,adjs){
  const od=item.openingDate||(S.settings.year+"-01-01");
  rows=rows||allRows();exps=exps||allExp();adjs=adjs||allAdj();
  const buys=exps.filter(e=>e.cat===STOK&&e.item===item.name&&e.date>=od);
  const adj=adjs.filter(a=>a.item===item.name&&a.date>=od);
  let used=0,used30=0;const last=rows.length?rows[rows.length-1].date:todayISO();
  const d30=new Date(last+"T00:00:00");d30.setDate(d30.getDate()-29);const from30=iso(d30);
  for(const r of rows){if(r.date<od)continue;const u=usageOf(r,r.c,item.name);used+=u;if(r.date>=from30)used30+=u}
  const bought=buys.reduce((s,e)=>s+n(e.qty),0), adjQ=adj.reduce((s,a)=>s+n(a.qty),0);
  const bal=n(item.opening)+bought+adjQ-used;
  const lastBuy=buys.filter(e=>n(e.qty)).pop();const unit=lastBuy?n(lastBuy.amount)/n(lastBuy.qty):0;
  const perDay=used30/30;const days=perDay>0?Math.max(0,bal)/perDay:null;
  const unset=!n(item.opening)&&!bought&&!adjQ;
  const status=unset?"unset":bal<=0?"out":bal<=n(item.min)?"low":"ok";
  return {od,bought,adjQ,used,bal,unit,value:Math.max(0,bal)*unit,perDay,days,status,buys,adj};
}

const FIELDS=["rows","returns","expenses","stockAdj"];
let writeQ=Promise.resolve();
function queue(fn){writeQ=writeQ.then(fn).catch(e=>{console.error(e);toast(e&&e.code==="quota_exceeded"?"Storan penuh. Padam data lama dulu.":"Gagal simpan. Semak sambungan dan cuba lagi.");setStatus("err")});return writeQ}
function blankMonth(){return {rows:{},returns:{},expenses:{},stockAdj:{}}}
function writeMonth(mk,patch){
  return queue(async()=>{
    const ref=S.db.doc("months/"+mk);
    const snap=await ref.get();
    if(snap.exists) await ref.update(patch);
    else{const c=blankMonth();for(const f of FIELDS) for(const [k,v] of Object.entries(patch[f]||{})) if(v) c[f][k]=v;await ref.set(c)}
    setStatus("ok");
  });
}
function localPut(mk,field,key,val){S.months[mk]=S.months[mk]||blankMonth();const o={...(S.months[mk][field]||{})};if(val)o[key]=val;else delete o[key];S.months[mk][field]=o}

async function deleteForm(){
  const o=S.form,k=keyOf(o),mk=mkOf(o.date);localPut(mk,"rows",k,null);
  loadForm(o.date,o.prod,o.chan);setStatus("wait");renderIsi();
  await writeMonth(mk,{rows:{[k]:null}});toast("Rekod dipadam");
}
document.addEventListener("click",e=>{
  if(S.tab!=="isi"||!S.form)return;const t=e.target;let b;
  if(b=t.closest("[data-prod]")){loadForm(S.form.date,b.dataset.prod,S.form.chan);renderIsi()}
  else if(b=t.closest("[data-chan]")){loadForm(S.form.date,S.form.prod,b.dataset.chan);renderIsi()}
  else if(b=t.closest("[data-open]")){const [p,c]=b.dataset.open.split("|");loadForm(S.form.date,p,c);renderIsi()}
  else if(b=t.closest("[data-day]")){const d=new Date(S.form.date+"T00:00:00");d.setDate(d.getDate()+ +b.dataset.day);loadForm(iso(d),S.form.prod,S.form.chan);renderIsi()}
  else if(b=t.closest("[data-step]")){const [g,i,dv]=b.dataset.step.split(":");const v=Math.max(0,n(S.form[g][i])+ +dv);S.form[g][i]=v;$(g+i).value=v||"";S.dirty=true;renderPreview()}
  else if(t.id==="saveBtn")saveForm();
  else if(t.id==="delBtn"){S.confirmDel="row";renderPreview()}
  else if(t.id==="delNo"){S.confirmDel=null;renderPreview()}
  else if(t.id==="delYes")deleteForm();
});
document.addEventListener("input",e=>{
  if(S.tab!=="isi"||!S.form)return;const t=e.target;
  if(t.dataset.arr){const [g,i]=t.dataset.arr.split(":");S.form[g][i]=Math.max(0,n(t.value));S.dirty=true;renderPreview()}
  else if(t.dataset.k){S.form[t.dataset.k]=t.dataset.k==="note"?t.value:n(t.value);S.dirty=true;renderPreview()}
});
document.addEventListener("change",e=>{if(S.tab==="isi"&&e.target.id==="fdate"&&e.target.value){loadForm(e.target.value,S.form.prod,S.form.chan);renderIsi()}});

/* ================= BELANJA & RETURN ================= */
function renderBelanja(){
  const st=S.settings;
  const top=`<div class="row between"><div><div class="eyebrow">Belanja</div><h2>${S.expSub==="exp"?"Belanja & beli stok":"Rekod return"}</h2></div>
    <div class="seg"><button data-sub="exp" aria-pressed="${S.expSub==="exp"}">Belanja</button><button data-sub="ret" aria-pressed="${S.expSub==="ret"}">Return</button></div></div>`;
  if(S.expSub==="ret"){$("main").innerHTML=top+returnHTML();return}
  const ef=S.expForm||(S.expForm={date:todayISO(),cat:st.expenseCats.find(c=>c!==STOK)||STOK,desc:"",amount:0,item:st.stock[0]?.name||"",qty:0});
  const yr=String(st.year),m=S.expMonth;
  const exps=allExp().filter(e=>m?e.date.startsWith(yr+"-"+String(m).padStart(2,"0")):e.date.startsWith(yr)).reverse();
  const hasM=BLN.map((_,i)=>allExp().some(e=>e.date.startsWith(yr+"-"+String(i+1).padStart(2,"0"))));
  const ea=expAgg(exps);
  const byCat={};exps.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+n(e.amount));
  const maxCat=Math.max(1,...Object.values(byCat));
  const isStock=ef.cat===STOK;
  $("main").innerHTML=top+`
  <div class="split">
    <div class="card">
      <div class="grid2"><label class="f">Tarikh<input id="e_date" type="date" value="${ef.date}"></label>
      <label class="f">Jumlah (RM)<input id="e_amount" type="number" inputmode="decimal" min="0" step="any" value="${ef.amount||""}" placeholder="0.00"></label></div>
      <div class="eyebrow">Kategori</div>
      <div class="chips">${st.expenseCats.map(c=>`<button class="chip" data-ecat="${esc(c)}" aria-pressed="${c===ef.cat}">${esc(c)}</button>`).join("")}</div>
      ${isStock?`<div class="grid2"><label class="f">Item stok<select id="e_item">${st.stock.map(s=>`<option ${s.name===ef.item?"selected":""}>${esc(s.name)}</option>`).join("")}</select></label>
        <label class="f">Kuantiti masuk (pcs)<input id="e_qty" type="number" inputmode="numeric" min="0" value="${ef.qty||""}" placeholder="0"></label></div>
        <div class="note" id="e_unit">${ef.qty&&ef.amount?"Harga seunit "+rm(ef.amount/ef.qty):"Kuantiti ini akan ditambah ke baki stok."}</div>`:""}
      <label class="f">Keterangan<input id="e_desc" type="text" value="${esc(ef.desc)}" placeholder="${isStock?"cth. Kilang ABC, batch Nov":"cth. Gaji packer November"}"></label>
      <div class="row between"><span class="note">${isStock?"Beli stok tak ditolak terus dari profit. Kos dikira bila barang dijual (cost product).":"Belanja ini ditolak dari net profit bulan itu."}</span>
        <button class="btn pri" id="e_add">Tambah ${isStock?"stok":"belanja"}</button></div>
    </div>
    <div class="card">
      <div class="row between"><h3>${m?BULAN[m-1]:"Setahun "+yr}</h3><span class="pill bad">${rm(ea.op+ea.stock)}</span></div>
      <div class="grid2"><div><div class="eyebrow">Belanja operasi</div><div class="num" style="font-size:18px;font-weight:600">${rm(ea.op)}</div></div>
        <div><div class="eyebrow">Beli stok</div><div class="num" style="font-size:18px;font-weight:600">${rm(ea.stock)}</div></div></div>
      ${Object.keys(byCat).length?Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="hbar"><span>${esc(c)}</span><span class="track"><span class="fill" style="width:${v/maxCat*100}%;${c===STOK?"background:var(--sky)":""}"></span></span><span class="num">${rm(v)}</span></div>`).join(""):'<div class="note">Belum ada belanja untuk tempoh ini.</div>'}
    </div>
  </div>
  ${monthChips(m,"data-em",hasM)}
  <div class="list">${exps.length?exps.map(e=>`<div class="item">
     <span><b>${esc(e.cat)}</b>${e.cat===STOK?` · ${esc(e.item)} +${int(n(e.qty))} pcs`:""}${e.desc?` · ${esc(e.desc)}`:""}<br><span class="sub">${fmtDate(e.date)}</span></span>
     <span class="row"><span class="num bad">${rm(n(e.amount))}</span>${S.confirmDel===e.id?`<button class="btn danger sm" data-edel="${e.id}">Padam</button><button class="btn ghost sm" data-eno="1">Batal</button>`:`<button class="btn ghost sm" data-eask="${e.id}" aria-label="Padam belanja">×</button>`}</span></div>`).join(""):`<div class="empty">Tiada belanja direkod untuk ${m?BULAN[m-1]:"tahun ini"}. Isi borang di atas untuk tambah.</div>`}</div>`;
}
function returnHTML(){
  const st=S.settings;const rf=S.retForm||(S.retForm={date:S.form?.date||todayISO(),prod:st.products[0]?.name||"",pk:0,count:1,special:0,note:""});
  const p=prodOf(rf.prod);const rets=allReturns().slice().reverse();
  return `<div class="split">
    <div class="card">
      <div class="grid2"><label class="f">Tarikh<input id="r_date" type="date" value="${rf.date}"></label>
      <label class="f">Produk<select id="r_prod">${st.products.map(x=>`<option ${x.name===rf.prod?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label></div>
      <div class="eyebrow">Pakej</div>
      <div class="chips">${(p?.pk||[]).map((x,i)=>`<button class="chip" data-rpk="${i}" aria-pressed="${rf.pk===i}">${esc(x)} <span class="num">RM${n(p.ret[i])}</span></button>`).join("")}</div>
      <div class="grid2"><label class="f">Bilangan<input id="r_count" type="number" inputmode="numeric" min="0" value="${rf.count||""}"></label>
      <label class="f">Special order (RM)<input id="r_special" type="number" inputmode="decimal" min="0" step="any" value="${rf.special||""}"></label></div>
      <label class="f">Catatan<input id="r_note" type="text" value="${esc(rf.note)}"></label>
      <div class="row between"><span>Nilai return <b class="num bad" id="r_val">${rm(retValue(rf))}</b></span><button class="btn pri" id="r_add">Tambah return</button></div>
      <div class="note">Nilai seunit ikut Tetapan → Produk. Nilai return ditolak dari net profit bulan itu.</div>
    </div>
    <div class="card"><h3>Senarai return</h3><div class="list">${rets.length?rets.map(r=>`<div class="item">
      <span><b>${esc(r.prod)}</b> · ${esc((prodOf(r.prod)?.pk||[])[r.pk]||"")} × ${r.count}<br><span class="sub">${fmtDate(r.date)}${r.note?" · "+esc(r.note):""}</span></span>
      <span class="row"><span class="num bad">${rm(r.v)}</span>${S.confirmDel===r.id?`<button class="btn danger sm" data-rdel="${r.id}">Padam</button><button class="btn ghost sm" data-rno="1">Batal</button>`:`<button class="btn ghost sm" data-rask="${r.id}" aria-label="Padam return">×</button>`}</span></div>`).join(""):`<div class="note">Belum ada return direkod.</div>`}</div></div>
  </div>`;
}
document.addEventListener("input",e=>{if(S.tab!=="belanja")return;const t=e.target;
  if(S.expSub==="exp"&&S.expForm){const ef=S.expForm;
    if(t.id==="e_amount")ef.amount=n(t.value);else if(t.id==="e_qty")ef.qty=n(t.value);else if(t.id==="e_desc")ef.desc=t.value;else return;
    const u=$("e_unit");if(u)u.textContent=ef.qty&&ef.amount?"Harga seunit "+rm(ef.amount/ef.qty):"Kuantiti ini akan ditambah ke baki stok."}
  else if(S.retForm){const rf=S.retForm;
    if(t.id==="r_count")rf.count=n(t.value);else if(t.id==="r_special")rf.special=n(t.value);else if(t.id==="r_note")rf.note=t.value;else return;
    $("r_val").textContent=rm(retValue(rf))}});
document.addEventListener("change",e=>{if(S.tab!=="belanja")return;const t=e.target;
  if(t.id==="e_date")S.expForm.date=t.value;else if(t.id==="e_item")S.expForm.item=t.value;
  else if(t.id==="r_date")S.retForm.date=t.value;else if(t.id==="r_prod"){S.retForm.prod=t.value;renderBelanja()}});
document.addEventListener("click",async e=>{if(S.tab!=="belanja")return;const t=e.target;let b;
  if(b=t.closest("[data-sub]")){S.expSub=b.dataset.sub;S.confirmDel=null;renderBelanja()}
  else if(b=t.closest("[data-ecat]")){S.expForm.cat=b.dataset.ecat;renderBelanja()}
  else if(b=t.closest("[data-em]")){S.expMonth=+b.dataset.em;renderBelanja()}
  else if(b=t.closest("[data-eask]")){S.confirmDel=b.dataset.eask;renderBelanja()}
  else if(b=t.closest("[data-eno]")){S.confirmDel=null;renderBelanja()}
  else if(b=t.closest("[data-edel]")){const ex=allExp().find(x=>x.id===b.dataset.edel);if(!ex)return;const mk=mkOf(ex.date);
    localPut(mk,"expenses",ex.id,null);S.confirmDel=null;renderBelanja();setStatus("wait");await writeMonth(mk,{expenses:{[ex.id]:null}});toast("Belanja dipadam")}
  else if(t.id==="e_add"){const ef=S.expForm;const isStock=ef.cat===STOK;
    if(!ef.date||!ef.amount&&!(isStock&&ef.qty)){toast("Isi tarikh dan jumlah RM dulu.");return}
    if(isStock&&!ef.qty){toast("Isi kuantiti stok yang masuk.");return}
    const id=uid("e");const o={date:ef.date,cat:ef.cat,desc:ef.desc||"",amount:n(ef.amount)};if(isStock){o.item=ef.item;o.qty=n(ef.qty)}
    const mk=mkOf(o.date);localPut(mk,"expenses",id,o);S.expForm={...ef,desc:"",amount:0,qty:0};renderBelanja();setStatus("wait");
    await writeMonth(mk,{expenses:{[id]:o}});toast(isStock?`Stok ${o.item} +${int(o.qty)} pcs ditambah`:"Belanja ditambah")}
  else if(b=t.closest("[data-rpk]")){S.retForm.pk=+b.dataset.rpk;renderBelanja()}
  else if(b=t.closest("[data-rask]")){S.confirmDel=b.dataset.rask;renderBelanja()}
  else if(b=t.closest("[data-rno]")){S.confirmDel=null;renderBelanja()}
  else if(b=t.closest("[data-rdel]")){const r=allReturns().find(x=>x.id===b.dataset.rdel);if(!r)return;const mk=mkOf(r.date);
    localPut(mk,"returns",r.id,null);S.confirmDel=null;renderBelanja();setStatus("wait");await writeMonth(mk,{returns:{[r.id]:null}});toast("Return dipadam")}
  else if(t.id==="r_add"){const rf=S.retForm;if(!rf.date||!rf.count&&!rf.special){toast("Isi tarikh dan bilangan.");return}
    const id=uid("t");const o={date:rf.date,prod:rf.prod,pk:rf.pk,count:n(rf.count),special:n(rf.special),note:rf.note||""};
    const mk=mkOf(o.date);localPut(mk,"returns",id,o);S.retForm={...rf,count:1,special:0,note:""};renderBelanja();setStatus("wait");
    await writeMonth(mk,{returns:{[id]:o}});toast("Return ditambah")}
});

/* ================= STOK ================= */
function renderStok(){
  const st=S.settings,rows=allRows(),exps=allExp(),adjs=allAdj();
  const stats=st.stock.map(it=>({it,s:stockStat(it,rows,exps,adjs)}));
  const sel=stats.find(x=>x.it.name===S.stockSel)||stats[0];
  const af=S.adjForm||(S.adjForm={date:todayISO(),qty:0,note:""});
  const totalVal=stats.reduce((a,x)=>a+x.s.value,0);
  const alerts=stats.filter(x=>x.s.status==="low"||x.s.status==="out");const unsetN=stats.filter(x=>x.s.status==="unset").length;
  let hist=[];
  if(sel){const s=sel.s,name=sel.it.name;
    hist.push({date:s.od,t:"Stok awal",q:n(sel.it.opening)});
    s.buys.forEach(e=>hist.push({date:e.date,t:"Beli stok"+(e.desc?" · "+e.desc:""),q:n(e.qty),rm:n(e.amount)}));
    s.adj.forEach(a=>hist.push({date:a.date,t:"Pelarasan"+(a.note?" · "+a.note:""),q:n(a.qty),id:a.id}));
    const byM={};rows.forEach(r=>{if(r.date<s.od)return;const u=usageOf(r,r.c,name);if(u){const k=mkOf(r.date);byM[k]=(byM[k]||0)+u}});
    Object.entries(byM).forEach(([k,v])=>{const [y,mm]=k.split("-");const last=new Date(+y,+mm,0).getDate();hist.push({date:k+"-"+String(last).padStart(2,"0"),t:"Terjual / guna · "+BULAN[+mm-1],q:-v})});
    hist.sort((a,b)=>a.date<b.date?1:-1);
  }
  const pctOf=s=>Math.max(0,Math.min(100,s.bal/Math.max(1,Math.max(s.bal,n(sel?.it.min)*3))*100));
  $("main").innerHTML=`<div class="row between"><div><div class="eyebrow">Stok</div><h2>Baki stok semasa</h2></div>
    <button class="btn teal sm" id="goBuy">+ Beli stok</button></div>
  ${unsetN?`<div class="info">${unsetN} item belum ada stok awal. Pilih item, kira stok fizikal, kemudian isi <b>Stok awal</b> dan tarikh kiraan di bawah.</div>`:""}
  ${alerts.length?`<div class="warn"><b>Perhatian:</b> ${alerts.map(x=>`${esc(x.it.name)} ${x.s.status==="out"?"habis":"tinggal "+int(x.s.bal)+" pcs"}`).join(" · ")}</div>`:""}
  <div class="stocks">${stats.map(({it,s})=>`<button class="stock ${s.status==="ok"?"":s.status} ${sel&&sel.it.name===it.name?"on":""}" data-ssel="${esc(it.name)}">
      <span class="row between"><b>${esc(it.name)}</b><span class="pill ${({ok:"good",low:"warn",out:"bad",unset:""})[s.status]}">${({ok:"Cukup",low:"Rendah",out:"Habis",unset:"Belum set"})[s.status]}</span></span>
      <span class="q ${s.bal<0&&s.status!=="unset"?"bad":""}">${s.status==="unset"?"–":int(s.bal)} <span class="note">pcs</span></span>
      <span class="meter"><i style="width:${Math.max(0,Math.min(100,s.bal/Math.max(1,n(it.min)*4)*100))}%"></i></span>
      <span class="note num">Masuk ${int(s.bought)} · Keluar ${int(s.used)}${s.adjQ?` · Laras ${s.adjQ>0?"+":""}${int(s.adjQ)}`:""}</span>
      <span class="note">${s.status==="unset"?`Terjual ${int(s.used)} pcs setakat ini. Isi stok awal untuk mula jejak.`:s.bal<=0?"Stok habis. Rekod beli stok atau semak stok awal.":s.days!=null?`Cukup lebih kurang <b>${Math.floor(s.days)} hari</b> (guna ${s.perDay.toFixed(1)}/hari)`:"Tiada penggunaan 30 hari lepas"}${s.unit?` · Nilai ${rm(s.value)}`:""}</span>
    </button>`).join("")}</div>
  <div class="note">Nilai stok anggaran (ikut harga beli terakhir): <b class="num">${rm(totalVal)}</b>. Keluar = pcs terjual + free gift dari rekod jualan sejak tarikh stok awal.</div>
  ${sel?`<div class="split">
    <div class="card">
      <h3>${esc(sel.it.name)}</h3>
      <div class="grid3 wrap">
        <label class="f">Stok awal (pcs)<input type="number" min="0" value="${n(sel.it.opening)}" data-stk="opening"></label>
        <label class="f">Tarikh stok awal<input type="date" value="${sel.s.od}" data-stk="openingDate"></label>
        <label class="f">Amaran bila tinggal (pcs)<input type="number" min="0" value="${n(sel.it.min)}" data-stk="min"></label></div>
      <div class="note">Kira stok fizikal sekali, isi sebagai stok awal dengan tarikh kiraan. Jualan sebelum tarikh itu tak ditolak.</div>
      <h3 style="margin-top:6px">Pelarasan stok</h3>
      <div class="grid3 wrap"><label class="f">Tarikh<input id="a_date" type="date" value="${af.date}"></label>
        <label class="f">Kuantiti (+/−)<input id="a_qty" type="number" step="1" value="${af.qty||""}" placeholder="cth. -5"></label>
        <label class="f">Sebab<input id="a_note" type="text" value="${esc(af.note)}" placeholder="rosak / hilang / kiraan"></label></div>
      <div><button class="btn ghost" id="a_add">Simpan pelarasan</button></div>
    </div>
    <div class="card"><h3>Pergerakan stok</h3><div class="list">${hist.map(h=>`<div class="item"><span>${esc(h.t)}<br><span class="sub">${fmtDate(h.date)}${h.rm?" · "+rm(h.rm):""}</span></span>
      <span class="row"><b class="num ${h.q<0?"bad":"good"}">${h.q>0?"+":""}${int(h.q)}</b>${h.id?(S.confirmDel===h.id?`<button class="btn danger sm" data-adel="${h.id}">Padam</button>`:`<button class="btn ghost sm" data-aask="${h.id}" aria-label="Padam pelarasan">×</button>`):""}</span></div>`).join("")}</div></div>
  </div>`:""}
  <div class="card"><h3>Tambah item stok lain</h3><div class="row"><input type="text" id="newItem" placeholder="cth. BOTOL, KOTAK, STICKER" style="flex:1"><button class="btn sm" id="addItem">Tambah item</button></div>
    <div class="note">Item yang sama nama dengan produk ditolak ikut pcs terjual. HALIA PATCH ditolak ikut free patch + patch dijual, KAYU ikut free kayu. Item lain hanya ikut beli stok & pelarasan.</div></div>`;
}
document.addEventListener("click",async e=>{if(S.tab!=="stok")return;const t=e.target,st=S.settings;let b;
  if(b=t.closest("[data-ssel]")){S.stockSel=b.dataset.ssel;S.confirmDel=null;renderStok()}
  else if(t.id==="goBuy"){const it=S.stockSel||st.stock[0]?.name;S.tab="belanja";S.expSub="exp";S.expForm={...(S.expForm||{date:todayISO(),desc:"",amount:0,qty:0}),cat:STOK,item:it};render();window.scrollTo(0,0)}
  else if(t.id==="a_add"){const af=S.adjForm;const it=S.stockSel||st.stock[0]?.name;if(!af.date||!af.qty){toast("Isi tarikh dan kuantiti pelarasan.");return}
    const id=uid("a");const o={date:af.date,item:it,qty:n(af.qty),note:af.note||""};const mk=mkOf(o.date);localPut(mk,"stockAdj",id,o);
    S.adjForm={date:af.date,qty:0,note:""};renderStok();setStatus("wait");await writeMonth(mk,{stockAdj:{[id]:o}});toast("Pelarasan disimpan")}
  else if(b=t.closest("[data-aask]")){S.confirmDel=b.dataset.aask;renderStok()}
  else if(b=t.closest("[data-adel]")){const a=allAdj().find(x=>x.id===b.dataset.adel);if(!a)return;const mk=mkOf(a.date);localPut(mk,"stockAdj",a.id,null);S.confirmDel=null;renderStok();setStatus("wait");await writeMonth(mk,{stockAdj:{[a.id]:null}});toast("Pelarasan dipadam")}
  else if(t.id==="addItem"){const v=$("newItem").value.trim().toUpperCase();if(!v||st.stock.some(s=>s.name===v))return;st.stock.push({name:v,opening:0,openingDate:todayISO(),min:10});S.stockSel=v;saveSettings();renderStok()}
});
document.addEventListener("input",e=>{if(S.tab!=="stok"||!S.adjForm)return;const t=e.target;if(t.id==="a_qty")S.adjForm.qty=n(t.value);else if(t.id==="a_note")S.adjForm.note=t.value});
document.addEventListener("change",e=>{if(S.tab!=="stok")return;const t=e.target,st=S.settings;
  if(t.id==="a_date")S.adjForm.date=t.value;
  else if(t.dataset.stk){const it=st.stock.find(s=>s.name===(S.stockSel||st.stock[0]?.name));if(!it)return;it[t.dataset.stk]=t.dataset.stk==="openingDate"?t.value:n(t.value);saveSettings();renderStok()}});

/* ================= LAPORAN ================= */
function monthly(){
  const rows=allRows(),rets=allReturns(),exps=allExp(),yr=String(S.settings.year);
  const ms=Array.from({length:12},(_,i)=>{const mk=yr+"-"+String(i+1).padStart(2,"0");
    const a=agg(rows.filter(r=>r.date.startsWith(mk)));a.ret=rets.filter(r=>r.date.startsWith(mk)).reduce((s,r)=>s+r.v,0);
    const ea=expAgg(exps.filter(e=>e.date.startsWith(mk)));a.op=ea.op;a.stockBuy=ea.stock;a.nExp=exps.filter(e=>e.date.startsWith(mk)).length;

function barChart(labels,s1,s2,{h=220}={}){
  const W=640,H=h,L=52,R=8,T=12,B=26,iw=W-L-R,ih=H-T-B;
  const vals=s1.concat(s2||[]);let mx=Math.max(0,...vals),mn=Math.min(0,...vals);if(mx===mn)mx=1;
  const step=nice((mx-mn)/4);mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;
  const y=v=>T+ih-(v-mn)/(mx-mn)*ih;const bw=iw/labels.length;
  let g="";for(let v=mn;v<=mx+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${Math.abs(v)<1e-9?1.4:.6}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${short(v)}</text>`}
  let bars="";labels.forEach((lb,i)=>{const x=L+i*bw,w=s2?bw*.36:bw*.6;
    const b=(v,off,col)=>{const y0=y(Math.max(0,v)),hh=Math.abs(y(v)-y(0));return `<rect x="${x+off}" y="${y0}" width="${w}" height="${Math.max(hh,v?1:0)}" rx="2" fill="${col}"><title>${lb}: ${rm(v)}</title></rect>`};
    if(s2){bars+=b(s1[i],bw*.12,"var(--sun)")+b(s2[i],bw*.5,s2[i]<0?"var(--bad)":"var(--head)")}else bars+=b(s1[i],bw*.2,s1[i]<0?"var(--bad)":"var(--head)");
    if(labels.length<=12||i%3===0||i===labels.length-1)bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${lb}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}</svg>`;
}
function nice(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function short(v){const a=Math.abs(v);return (v<0?"-":"")+(a>=1000?(a/1000).toFixed(a>=10000?0:1)+"k":Math.round(a))}

async function exportXlsx(){

  const {rows,rets,exps,ms}=monthly(),st=S.settings;const X=window.XLSX;const wb=X.utils.book_new();
  const r2=v=>Math.round(v*100)/100;
  const add=(aoa,name)=>X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(aoa),name);
  add([["MONTH","TOTAL SALES","TOTAL ADS","TAX ADS","UNTUNG JUALAN","TOTAL RETURN","BELANJA OPERASI","NET PROFIT BERSIH","PROFIT MARGIN","BELI STOK","ALIRAN TUNAI","TOTAL PURCHASE","QUANTITY (PCS)","ROAS"]]
    .concat(ms.map((a,i)=>[BULAN[i],r2(a.sales),r2(a.ads),r2(a.taxAds),r2(a.net),r2(a.ret),r2(a.op),r2(a.netAll),a.sales?r2(a.netAll/a.sales*100)/100:0,r2(a.stockBuy),r2(a.cash),a.purchase,a.qty,a.ads?r2(a.sales/a.ads):0])),"RINGKASAN BULANAN");
  const h=["DATE","DAY","PRODUK","SALURAN","OT TRIAL","OT JIMAT","OT SEMBUH/KELUARGA","COD TRIAL","COD JIMAT","COD SEMBUH/KELUARGA","HALIA PATCH DIJUAL","FB ADS","LINK CLICK","FREE POSTAGE","SPECIAL DISCOUNT/ORDER","OPEN AI","SABAH/SARAWAK","TOTAL PURCHASE","QUANTITY (PCS)","FREE HALIA PATCH","FREE KAYU","SALES ONLINE","TAX FB ADS","SHIPPING ONLINE","SHIPPING COD","TAX SHIPPING ONLINE","TAX SHIPPING COD","COST PRODUCT","FREE GIFT COST","UNTUNG JUALAN","ROAS","ROAS INCL TAX","COST PER PURCHASE","CONVERSION RATE","CATATAN"];
  add([h].concat(rows.map(r=>{const c=r.c;return [r.date,dayName(r.date),r.prod,r.chan,...r.ot,...r.cod,r.patch,r.ads,r.clicks,r.freePost,r.special,r.openai,r.sabah,c.purchase,c.qty,c.freePatch||0,c.freeKayu||0,r2(c.sales),r2(c.taxAds||0),r2(c.shipOT||0),r2(c.shipCOD||0),r2(c.taxShipOT||0),r2(c.taxShipCOD||0),r2(c.cost||0),r2(c.gift||0),r2(c.net),r2(c.roas||0),r2(c.roasTax||0),r2(c.cpp||0),r2(c.conv||0),r.note||""]})),"INPUT HARIAN");
  const d3=[["MONTH","PRODUK","SALURAN","SALES","ADS","UNTUNG JUALAN","PURCHASE","PCS"]];
  ms.forEach((_,i)=>{const mk=st.year+"-"+String(i+1).padStart(2,"0");for(const p of st.products)for(const c of st.channels){const a=agg(rows.filter(r=>r.date.startsWith(mk)&&r.prod===p.name&&r.chan===c));if(a.n)d3.push([BULAN[i],p.name,c,r2(a.sales),r2(a.ads),r2(a.net),a.purchase,a.qty])}});
  add(d3,"IKUT PRODUK & SALURAN");
  const days={};rows.forEach(r=>{(days[r.date]=days[r.date]||[]).push(r)});rets.forEach(r=>{days[r.date]=days[r.date]||[]});
  add([["DATE","DAY",...st.products.map(p=>p.name+" UNTUNG"),"TOTAL SALES","TOTAL ADS","RETURN","UNTUNG / HARI"]].concat(Object.keys(days).sort().map(d=>{const rr=days[d];const a=agg(rr);const rv=rets.filter(r=>r.date===d).reduce((s,r)=>s+r.v,0);return [d,dayName(d),...st.products.map(p=>r2(agg(rr.filter(r=>r.prod===p.name)).net)),r2(a.sales),r2(a.ads),r2(rv),r2(a.net-rv)]})),"PROFIT HARIAN");
  add([["DATE","KATEGORI","KETERANGAN","JUMLAH (RM)","ITEM STOK","KUANTITI"]].concat(exps.map(e=>[e.date,e.cat,e.desc||"",r2(n(e.amount)),e.item||"",e.qty||""])),"BELANJA");
  add([["ITEM","STOK AWAL","TARIKH STOK AWAL","MASUK","KELUAR","PELARASAN","BAKI","AMARAN","NILAI ANGGARAN"]].concat(st.stock.map(it=>{const s=stockStat(it,rows,exps,allAdj());return [it.name,n(it.opening),s.od,s.bought,s.used,s.adjQ,s.bal,n(it.min),r2(s.value)]})),"STOK");
  add([["DATE","PRODUK","PAKEJ","BILANGAN","SPECIAL ORDER","TOTAL RETURN","CATATAN"]].concat(rets.map(r=>[r.date,r.prod,(prodOf(r.prod)?.pk||[])[r.pk]||"",r.count,r.special,r2(r.v),r.note||""])),"RETURN");
  const out=X.write(wb,{bookType:"xlsx",type:"array"});
  try{await S.downloads.save({filename:"JT_Flipping_PnL_"+st.year+".xlsx",data:new Blob([out])});toast("Fail Excel disimpan")}
  catch(e){if(e&&e.code!=="declined")toast("Tak dapat muat turun ("+(e.code||"ralat")+")")}
}

    <div class="row"><input type="text" id="newProd" placeholder="Nama produk baru" style="flex:1"><button class="btn sm" id="addProd">Tambah produk</button></div></div>
  <div class="card"><h3>Saluran</h3><div class="chips">${st.channels.map(c=>`<span class="chip" style="cursor:default">${esc(c)}</span>`).join("")}</div>
    <div class="row"><input type="text" id="newChan" placeholder="Saluran baru (cth. TIKTOK)" style="flex:1"><button class="btn sm" id="addChan">Tambah saluran</button></div></div>
  <div class="card"><h3>Kadar harga ikut produk & saluran</h3>
    ${Object.entries(groups).map(([g,list])=>{list.sort((a,b)=>a.from<b.from?1:-1);const [pp,cc]=g.split("|");return `<div style="display:grid;gap:8px;padding-bottom:12px;border-bottom:1px dashed var(--line)">
      <div class="row between"><b>${esc(pp)} · ${esc(cc)}</b><button class="btn ghost sm" data-newrate="${list[0].id}">Harga baru mula…</button></div>
      ${list.map((r,ix)=>`<details ${S.openRate===r.id?"open":""} data-rid="${r.id}"><summary>${ix===0?"Semasa":"Lama"}: berkuat dari ${fmtDate(r.from)} <span class="note num">· OT ${r.ot.join("/")} · COD ${r.cod.join("/")}</span></summary>
        <div style="display:grid;gap:8px;margin-top:10px">
          <div class="grid3"><label class="f">Berkuat dari<input type="date" value="${r.from}" data-ratef="${r.id}:from"></label>
          <label class="f">Kos produk (RM/pcs)<input type="number" step="any" value="${n(r.cost)}" data-ratef="${r.id}:cost"></label>
          <label class="f">Harga halia patch dijual<input type="number" step="any" value="${n(r.patchPrice)}" data-ratef="${r.id}:patchPrice"></label></div>
          <div class="rate-grid"><span></span>${(prodOf(r.prod)?.pk||["1","2","3"]).map(x=>`<span class="h">${esc(x)}</span>`).join("")}
            ${arrRow(r.id,"ot","Harga OT")}${arrRow(r.id,"cod","Harga COD")}${arrRow(r.id,"posOT","Pos OT")}${arrRow(r.id,"posCOD","Pos COD")}
            ${arrRow(r.id,"patchOT","Free patch OT")}${arrRow(r.id,"patchCOD","Free patch COD")}${arrRow(r.id,"kayuOT","Free kayu OT")}${arrRow(r.id,"kayuCOD","Free kayu COD")}</div>
          ${list.length>1?`<div><button class="btn danger sm" data-delrate="${r.id}">${S.confirmDel===r.id?"Tekan sekali lagi untuk padam":"Padam kadar ini"}</button></div>`:""}
        </div></details>`).join("")}</div>`}).join("")}
    <div class="note">Kombinasi produk & saluran yang belum ada kadar:</div>
    <div class="chips">${st.products.flatMap(p=>st.channels.filter(c=>!groups[p.name+"|"+c]).map(c=>`<button class="chip" data-addrate="${esc(p.name)}|${esc(c)}">+ ${esc(p.name)} · ${esc(c)}</button>`)).join("")||'<span class="note">Semua lengkap.</span>'}</div>
  </div>`;
}
const z3=()=>[0,0,0];
document.addEventListener("change",e=>{if(S.tab!=="tetapan")return;const t=e.target,st=S.settings;let d;
  if(d=t.dataset.set){st[d]=d==="year"?n(t.value):n(t.value)/100;saveSettings()}
  else if(d=t.dataset.prodf){const [pi,f,i]=d.split(":");const p=st.products[+pi];if(i!=null)p[f][+i]=f==="pk"?t.value:n(t.value);else p[f]=n(t.value);saveSettings()}
  else if(d=t.dataset.rate){const [id,f,i]=d.split(":");st.rates.find(r=>r.id===id)[f][+i]=n(t.value);saveSettings()}
  else if(d=t.dataset.ratef){const [id,f]=d.split(":");const r=st.rates.find(r=>r.id===id);r[f]=f==="from"?t.value:n(t.value);saveSettings();if(f==="from"){S.openRate=id;renderTetapan()}}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.rid&&d.open)S.openRate=d.dataset.rid},true);
document.addEventListener("click",e=>{if(S.tab!=="tetapan")return;const t=e.target,st=S.settings;let b;
  if(b=t.closest("[data-newrate]")){const src=st.rates.find(r=>r.id===b.dataset.newrate);const nr=JSON.parse(JSON.stringify(src));nr.id=uid("r");nr.from=todayISO();st.rates.push(nr);S.openRate=nr.id;saveSettings();renderTetapan();toast("Kadar baru dibuat. Ubah harga di bawah.")}
  else if(b=t.closest("[data-addrate]")){const [p,c]=b.dataset.addrate.split("|");const nr={id:uid("r"),prod:p,chan:c,from:st.year+"-01-01",ot:z3(),cod:z3(),posOT:[5,5,5],posCOD:[8,8,8],cost:0,patchOT:z3(),patchCOD:z3(),kayuOT:z3(),kayuCOD:z3(),patchPrice:0};st.rates.push(nr);S.openRate=nr.id;saveSettings();renderTetapan()}
  else if(b=t.closest("[data-delrate]")){const id=b.dataset.delrate;if(S.confirmDel!==id){S.confirmDel=id;S.openRate=id;renderTetapan();return}st.rates=st.rates.filter(r=>r.id!==id);S.confirmDel=null;saveSettings();renderTetapan()}
  else if(b=t.closest("[data-delcat]")){st.expenseCats.splice(+b.dataset.delcat,1);saveSettings();renderTetapan()}
  else if(t.id==="addCat"){const v=$("newCat").value.trim().toUpperCase();if(!v||st.expenseCats.includes(v))return;st.expenseCats.push(v);saveSettings();renderTetapan()}
  else if(t.id==="addProd"){const v=$("newProd").value.trim().toUpperCase();if(!v||prodOf(v))return;st.products.push({name:v,pk:["TRIAL","JIMAT","SEMBUH"],units:[1,3,5],patchCost:2,kayuCost:5,ret:[0,0,0]});if(!st.stock.some(s=>s.name===v))st.stock.push({name:v,opening:0,openingDate:todayISO(),min:50});saveSettings();renderTetapan()}
  else if(t.id==="addChan"){const v=$("newChan").value.trim().toUpperCase();if(!v||st.channels.includes(v))return;st.channels.push(v);saveSettings();renderTetapan()}
});

/* ---------- boot ---------- */
try{const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))S.tab=h}catch(_){}
renderTabs();
(async()=>{
  const db=await (window.claude?.use?window.claude.use("db"):null);
  S.db=db;
  if(!db){setStatus("off");$("statusTxt").textContent="Tiada sambungan data";render();return}
  claude.use("downloads").then(d=>{S.downloads=d;if(S.tab==="laporan")render()});
  const typing=()=>{const a=document.activeElement;return a&&a.closest&&a.closest("#main")&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)};
  db.doc("settings/main").onSnapshot(s=>{
    if(S.loadedS&&S.tab==="tetapan"&&typing())return;
    S.settings=s.exists?normSettings(JSON.parse(JSON.stringify(s.data()))):null;S.loadedS=true;setStatus("ok");render()},
    e=>{setStatus("off");console.error(e)});
  db.collection("months").onSnapshot(s=>{
    const m={};s.docs.forEach(d=>{const v=d.data()||{};const o={};for(const f of FIELDS)o[f]=Object.fromEntries(Object.entries(v[f]||{}).filter(([,x])=>x));m[d.id]=o});
    S.months=m;S.loadedM=true;setStatus("ok");
    if(typing()){if(S.tab==="isi"&&S.form)renderPreview();return}
    if(S.tab==="isi"&&S.form&&!S.dirty)loadForm(S.form.date,S.form.prod,S.form.chan);
    render()},e=>{setStatus("off");console.error(e)});
})();
})();
</script>
